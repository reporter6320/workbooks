<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Calculator</title>
<style>
  :root{--bg:#fdfdfb;--fg:#222;--muted:#666;--accent:#2457c5;--card:#fff;--line:#e6e6e2}
  @media(prefers-color-scheme:dark){:root{--bg:#151515;--fg:#ddd;--muted:#999;--accent:#7fa8ff;--card:#1e1e1e;--line:#333}}
  body{font-family:system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:var(--fg);background:var(--bg)}
  a{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.4rem;margin:1.2rem 0}
  label{display:block;margin:.8rem 0 .2rem;font-weight:600}
  input[type=range]{width:100%}
  .val{float:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
  svg{width:100%;height:180px}
</style>
</head>
<body>
<p><a href="../../">← All workbooks</a></p>
<h1>Savings Calculator</h1>
<p>A test page to confirm the pipeline works. Move the sliders and the numbers and chart update live. Your last values are remembered in this browser.</p>

<div class="card">
  <label>Monthly saving <span class="val" id="vM"></span></label>
  <input type="range" id="m" min="0" max="2000" step="25" value="300">
  <label>Annual return <span class="val" id="vR"></span></label>
  <input type="range" id="r" min="0" max="12" step="0.5" value="5">
  <label>Years <span class="val" id="vY"></span></label>
  <input type="range" id="y" min="1" max="40" step="1" value="10">
</div>

<div class="card">
  <div>Balance after <span id="yy"></span> years</div>
  <div class="big" id="total"></div>
  <div style="color:var(--muted)">of which contributions: <span id="contrib"></span></div>
  <svg id="chart" viewBox="0 0 400 180" preserveAspectRatio="none" aria-label="Balance over time"></svg>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0});
try{const s=JSON.parse(localStorage.getItem('hello-workbook')||'{}');for(const k of ['m','r','y'])if(s[k]!=null)$(k).value=s[k];}catch(e){}
function update(){
  const m=+$('m').value, r=+$('r').value/100/12, y=+$('y').value;
  $('vM').textContent=fmt(m); $('vR').textContent=$('r').value+'%'; $('vY').textContent=y; $('yy').textContent=y;
  let bal=0; const pts=[0];
  for(let i=1;i<=y*12;i++){bal=bal*(1+r)+m; if(i%12===0)pts.push(bal);}
  $('total').textContent=fmt(bal); $('contrib').textContent=fmt(m*12*y);
  const max=Math.max(...pts,1), w=400, h=170;
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i/(pts.length-1))*w},${h-(v/max)*(h-10)+5}`).join(' ');
  $('chart').innerHTML=`<path d="${d} L${w},${h+5} L0,${h+5}Z" fill="currentColor" opacity=".12"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
  $('chart').style.color=getComputedStyle(document.documentElement).getPropertyValue('--accent');
  try{localStorage.setItem('hello-workbook',JSON.stringify({m:$('m').value,r:$('r').value,y:$('y').value}));}catch(e){}
}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',update));
update();
</script>
</body>
</html>
